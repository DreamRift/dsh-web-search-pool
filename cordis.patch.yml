# dsh-web-search-pool Bundle patch for DeepSeek Harness (0.1.1-rc.x / 0.1.2+).
# The web row is host-owned. Its complete config is restated because an id-targeted
# patch replaces the whole config rather than deep-merging it: 0.1.2's official web row
# carries `fetchProvider: http` beside `searchProvider`, so both must be restated or the
# fetch-provider pin is silently dropped (web_fetch would then rely on auto-selection).
# `fetchProvider` exists in the web seam schema on both lines, so this stays safe on 0.1.1-rc.x.

# Override the official 'web' row to use search-pool provider
- id: web
  config:
    searchProvider: search-pool
    fetchProvider: http

# Insert the search pool provider definition
- insert:
    - id: web-search-pool
      name: dsh-web-search-pool
      config:
        enabled: true
        providers:
          tavily:
            keys: []
          exa:
            keys: []
        strategy: weighted-round-robin
        providerPriority: [tavily, exa]
        allowedFails: 3
        cooldownMs: 30000
        retryAfterFallbackMs: 1000
        usageCacheMs: 300000
        quotaReserveCredits: 2
        quotaExhaustedCooldownMs: 2592000000
        requestTimeoutMs: 20000
