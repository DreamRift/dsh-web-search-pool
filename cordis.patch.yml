# dsh-web-search-pool Bundle patch for DeepSeek Harness (0.1.7+ / 0.2.0+).
#
# 0.5.0（2026-10-19）起本 patch **不再改写官方 'web' 行**。
# 官方搜索的接管发生在运行时（src/dsh/takeover.js 直接替换 ctx.web.search），
# 因此不依赖 web.searchProvider、也不会和用户 profile 的 cordis.patch.yml 或
# 官方 Web search 设置页互相覆盖。0.4.0 的 web 行覆盖写法会在 profile 层被覆盖，
# 表现为“启用了 key 池却仍走官方 API key”，已移除。
#
# 这里只插入搜索池自身的 loader 行；行 id 同时是 settings namespace
# （web-search-pool），Config schema 自动投影成插件页表单，client card 注册到
# plugins.row.config 的 key dsh-web-search-pool#web-search-pool。
- insert:
    - id: web-search-pool
      name: dsh-web-search-pool
      config:
        enabled: true
        # 池不可用/全部 key 失败时是否回退官方搜索。默认 false = 启用即完全替代；
        # 回退时模型看到的仍是同一个 web_search 工具，只是结果来自官方。
        fallbackToOfficial: false
        providers:
          tavily:
            keys: []
          exa:
            keys: []
        strategy: weighted-round-robin
        providerPriority: [tavily, exa]
        allowedFails: 3
        cooldownMs: 30000
        retryAfterFallbackMs: 1000
        usageCacheMs: 300000
        quotaReserveCredits: 2
        quotaExhaustedCooldownMs: 2592000000
        requestTimeoutMs: 20000
